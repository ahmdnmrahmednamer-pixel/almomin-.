name: almomin
description: "Al-Momin (المؤمن) — Comprehensive, ad-free Islamic app built as a sadaqa jariya."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Local Database & Storage
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # Audio & Media
  just_audio: ^0.9.38
  audio_service: ^0.18.15

  # Background Downloads
  background_downloader: 9.6.4

  # Networking (Content Packs Only)
  dio: ^5.4.3+1

  # Notifications & Alarms
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.3
  flutter_timezone: 3.0.1

  # Prayer Times & Calculations
  adhan_dart: ^1.1.0

  # Sensors & Location
  geolocator: ^12.0.0
  sensors_plus: ^5.0.1
  permission_handler: ^11.3.1

  # Utilities
  share_plus: 10.1.4
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.3

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/data/quran.db
    - assets/data/surahs.json
    - assets/data/juz.json
    - assets/data/quran_ayahs.json
    - assets/data/surahs/
    - test/fixtures/normalizer_vectors.json
