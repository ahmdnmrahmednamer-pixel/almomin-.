<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 460" width="1080" height="460">
  <defs>
    <linearGradient id="headerGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F5B45"/>
      <stop offset="100%" stop-color="#0A3D2E"/>
    </linearGradient>
    <linearGradient id="latticeFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8893A" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#B8893A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#B8893A" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="460" fill="url(#headerGrad)"/>
  
  <!-- Decorative 8-point geometric stars on the left (RTL safe on right) -->
  <g stroke="url(#latticeFade)" stroke-width="1.5" fill="none">
    <g transform="translate(180, 230) scale(1.6)">
      <rect x="-60" y="-60" width="120" height="120"/>
      <rect x="-60" y="-60" width="120" height="120" transform="rotate(45)"/>
      <circle r="40"/>
    </g>
    <g transform="translate(380, 140) scale(1.0)">
      <rect x="-40" y="-40" width="80" height="80"/>
      <rect x="-40" y="-40" width="80" height="80" transform="rotate(45)"/>
    </g>
    <g transform="translate(100, 340) scale(0.9)">
      <rect x="-35" y="-35" width="70" height="70"/>
      <rect x="-35" y="-35" width="70" height="70" transform="rotate(45)"/>
    </g>
  </g>
  
  <!-- Subtle gold baseline accent -->
  <line x1="0" y1="458" x2="1080" y2="458" stroke="#B8893A" stroke-opacity="0.4" stroke-width="2"/>
</svg>